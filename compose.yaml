name: agent-tavern
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_tavern
      POSTGRES_USER: tavern
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/start.ps1 or set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tavern -d agent_tavern']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/agent_tavern
      DATABASE_USERNAME: tavern
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Missing database password}
      AGENT_TAVERN_AGENT_PROVIDER: ${AGENT_TAVERN_AGENT_PROVIDER:-local}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-512}
      DEEPSEEK_MAX_REQUESTS_PER_HOUR: ${DEEPSEEK_MAX_REQUESTS_PER_HOUR:-120}
      AGENT_TAVERN_SECURE_COOKIE: ${AGENT_TAVERN_SECURE_COOKIE:-false}
      AGENT_TAVERN_CORS_ORIGINS: ${AGENT_TAVERN_CORS_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:8080'
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
volumes:
  postgres_data:
