name: Verify game
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: agent-tavern-ci
      AGENT_TAVERN_AGENT_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated test credentials
        run: echo "DATABASE_PASSWORD=$(openssl rand -hex 32)" > .env
      - name: Build and start the production stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify proxy, SSE and database recovery after restart
        run: python3 scripts/smoke-stack.py --restart
      - name: Back up and restore the test database
        run: python3 scripts/backup-stack.py --verify
      - name: Capture diagnostics
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-diagnostics
          path: compose.log
      - name: Clean the isolated CI stack
        if: always()
        run: docker compose down --volumes
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend and PostgreSQL recovery contracts
        run: bash backend/mvnw -f backend/pom.xml -Ppostgres-it verify
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local backend
        run: |
          java -jar backend/target/agent-tavern-backend-0.1.0-SNAPSHOT.jar --spring.profiles.active=local --agent-tavern.agent-provider=local > backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/tables/roster > /dev/null; then exit 0; fi
            sleep 1
          done
          cat backend.log
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diagnostics
          path: |
            backend.log
            backend/target/surefire-reports
            backend/target/failsafe-reports
            frontend/playwright-report
            frontend/test-results
