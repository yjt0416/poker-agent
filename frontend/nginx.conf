worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 16k;
    limit_req_zone $binary_remote_addr zone=table_create:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=table_api:10m rate=15r/s;
    limit_conn_zone $binary_remote_addr zone=table_stream:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Re-resolve after Compose replaces the backend container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        set $backend http://backend:8080;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        location = /health { access_log off; return 200 'ok'; }
        location = /api/health { proxy_pass $backend/actuator/health/readiness; }
        location ^~ /actuator { return 404; }
        location = /api/tables {
            limit_req zone=table_create burst=3 nodelay;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location = /api/tables/current/events {
            limit_conn table_stream 12;
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 65s;
            add_header X-Accel-Buffering no;
            add_header Cache-Control 'no-store';
        }
        location /api/ {
            limit_req zone=table_api burst=30 nodelay;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            add_header Cache-Control 'no-store';
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
